<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#090E17" />
  <!-- Excavation Trench Lines -->
  <polygon points="40,240 600,220 580,340 20,350" fill="#1C1917" stroke="#44403C" stroke-width="2" />
  <polygon points="120,260 520,245 500,320 100,330" fill="#0C0A09" stroke="#78350F" stroke-width="2" />
  <!-- Danger Buffer Zone -->
  <line x1="60" y1="210" x2="580" y2="190" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 4" />
  <text x="240" y="200" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="bold">2.5M TRENCH EXCLUSION ZONE</text>
  <!-- Worker near edge -->
  <circle cx="280" cy="180" r="12" fill="#E2E8F0" />
  <rect x="270" y="195" width="20" height="35" fill="#F59E0B" />
  <line x1="275" y1="230" x2="272" y2="265" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
  <line x1="285" y1="230" x2="288" y2="265" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
  <!-- Box -->
  <rect x="255" y="160" width="55" height="110" fill="rgba(245, 158, 11, 0.1)" stroke="#F59E0B" stroke-width="2" />
  <rect x="240" y="135" width="135" height="22" fill="#0B1220" stroke="#F59E0B" rx="3" />
  <text x="248" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">ZONE INCURSION (94%)</text>
  <!-- Camera Overlay -->
  <rect x="16" y="16" width="200" height="42" fill="rgba(11, 18, 32, 0.85)" stroke="#1E293B" rx="4" />
  <text x="26" y="34" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="bold">CAM-008 [HD/30FPS]</text>
  <text x="26" y="48" fill="#94A3B8" font-family="monospace" font-size="9">Sub-level B2 / Shoring</text>
</svg>
