<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(59, 130, 246, 0.08)" stroke-width="0.5" />
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)" />
  <rect width="640" height="360" fill="url(#grid)" />

  <!-- Construction Background Elements -->
  <!-- Tower Structure & Scaffolding Lines -->
  <path d="M 60 40 L 60 320 M 160 40 L 160 320 M 260 40 L 260 320 M 60 80 L 260 80 M 60 160 L 260 160 M 60 240 L 260 240" stroke="#334155" stroke-width="2" />
  <line x1="60" y1="80" x2="160" y2="160" stroke="#1E293B" stroke-width="1.5" />
  <line x1="160" y1="80" x2="60" y2="160" stroke="#1E293B" stroke-width="1.5" />
  <line x1="160" y1="160" x2="260" y2="240" stroke="#1E293B" stroke-width="1.5" />
  <line x1="260" y1="160" x2="160" y2="240" stroke="#1E293B" stroke-width="1.5" />

  <!-- Crane Hook Overhead -->
  <line x1="380" y1="0" x2="380" y2="90" stroke="#94A3B8" stroke-width="2" />
  <rect x="365" y="90" width="30" height="20" fill="#F59E0B" rx="2" />
  <path d="M 380 110 C 380 135 365 140 365 130" fill="none" stroke="#F59E0B" stroke-width="3" />

  <!-- Restricted Zone Polygon on Floor -->
  <polygon points="260,180 540,160 590,320 220,330" fill="rgba(239, 68, 68, 0.12)" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 3" />
  <text x="320" y="315" fill="#EF4444" font-family="monospace" font-size="11" font-weight="700">DANGER ZONE: ACTIVE HOIST RADIUS (LVL 08)</text>

  <!-- Worker Silhouette -->
  <!-- Head without Helmet -->
  <circle cx="390" cy="190" r="14" fill="#E2E8F0" />
  <!-- High-Vis Vest -->
  <path d="M 370 208 L 410 208 L 418 265 L 362 265 Z" fill="#F59E0B" />
  <!-- Reflective Stripes -->
  <line x1="376" y1="218" x2="404" y2="218" stroke="#FFFFFF" stroke-width="3" />
  <line x1="372" y1="238" x2="408" y2="238" stroke="#FFFFFF" stroke-width="3" />
  <!-- Legs -->
  <line x1="376" y1="265" x2="372" y2="310" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
  <line x1="404" y1="265" x2="408" y2="310" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />

  <!-- AI Detection Bounding Box (NO HELMET) -->
  <rect x="350" y="165" width="80" height="155" fill="rgba(239, 68, 68, 0.08)" stroke="#EF4444" stroke-width="2" />
  <!-- Tag -->
  <rect x="350" y="138" width="135" height="24" fill="#0B1220" stroke="#EF4444" stroke-width="1.5" rx="3" />
  <circle cx="360" cy="150" r="4" fill="#EF4444" />
  <text x="370" y="154" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">NO HELMET</text>
  <text x="445" y="154" fill="#EF4444" font-family="monospace" font-size="10">96.4%</text>

  <!-- High-Vis Vest Sub-Detection Tag -->
  <rect x="350" y="210" width="80" height="58" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" />
  <rect x="435" y="212" width="90" height="18" fill="#0B1220" stroke="#10B981" rx="2" />
  <text x="440" y="225" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="bold">VEST OK 91%</text>

  <!-- Camera HUD Telemetry -->
  <rect x="16" y="16" width="220" height="50" fill="rgba(11, 18, 32, 0.85)" stroke="#1E293B" rx="4" />
  <circle cx="32" cy="34" r="5" fill="#EF4444" />
  <text x="45" y="38" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="bold">CAM-014 [4K/30FPS]</text>
  <text x="45" y="54" fill="#94A3B8" font-family="monospace" font-size="10">2026-09-26 00:11:45 UTC</text>

  <rect x="480" y="16" width="144" height="28" fill="rgba(11, 18, 32, 0.85)" stroke="#1E293B" rx="4" />
  <text x="492" y="34" fill="#38BDF8" font-family="monospace" font-size="10">AI INFERENCE: 48ms</text>
</svg>
