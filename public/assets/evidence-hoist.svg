<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0B1220" />
  <!-- Hoist Tower Frame -->
  <rect x="220" y="20" width="180" height="320" fill="none" stroke="#475569" stroke-width="3" />
  <line x1="220" y1="20" x2="400" y2="100" stroke="#334155" stroke-width="1.5" />
  <line x1="400" y1="20" x2="220" y2="100" stroke="#334155" stroke-width="1.5" />
  <line x1="220" y1="100" x2="400" y2="180" stroke="#334155" stroke-width="1.5" />
  <line x1="400" y1="100" x2="220" y2="180" stroke="#334155" stroke-width="1.5" />
  <!-- Hoist Car in motion -->
  <rect x="235" y="110" width="150" height="110" fill="#1E293B" stroke="#60A5FA" stroke-width="2" />
  <!-- Gate ajar -->
  <line x1="310" y1="120" x2="335" y2="210" stroke="#EF4444" stroke-width="3" />
  <!-- AI box -->
  <rect x="295" y="115" width="55" height="100" fill="rgba(239, 68, 68, 0.1)" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3" />
  <rect x="250" y="85" width="130" height="20" fill="#0B1220" stroke="#EF4444" rx="2" />
  <text x="256" y="99" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold">GATE AJAR (98%)</text>
  <rect x="16" y="16" width="190" height="38" fill="rgba(11, 18, 32, 0.85)" stroke="#1E293B" rx="4" />
  <text x="24" y="32" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="bold">CAM-003 [2K/25FPS]</text>
  <text x="24" y="46" fill="#94A3B8" font-family="monospace" font-size="9">North Tower Hoist Bay</text>
</svg>
